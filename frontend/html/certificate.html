<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Certificate</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/certificate.css" />
</head>

<body>
  <div class="content">
    <div class="certificate">
      <div class="logo">
        <h2>QuizApp</h2>
      </div>

      <p class="award-text">This Certificate is Awarded To</p>
      <h1 id="studentName">Student Name</h1>
      <p class="complete-text">for successfully completing</p>
      <h2 id="quizCategory">HTML & CSS Quiz</h2>
      <p class="date">
        Completion Date :
        <span id="completionDate"></span>
      </p>

      <div class="bottom">
        <div class="left-sign">
          <hr />
          <p></p>
        </div>
        <div class="right-date">
          <hr />
          <p>QuizApp</p>
        </div>
      </div>
    </div>
    <button id="printBtn">Download Certificate</button>
  </div>

  <script src="../js/certificate.js"></script>
</body>

</html>
